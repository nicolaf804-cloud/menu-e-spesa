name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the Android project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          # the old ProGuard setting is refused by recent Android Gradle plugins
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" android/app/build.gradle
          # a new version number on every build, so the phone sees it as an update
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Use the fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret DEBUG_KEYSTORE_B64 is missing"; exit 1; fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../menu-e-spesa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: menu-e-spesa-apk
          path: menu-e-spesa.apk

      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Menù e spesa 1.${{ github.run_number }}
          body: "Open this page on the phone and tap menu-e-spesa.apk to download and install."
          files: menu-e-spesa.apk
          make_latest: true
